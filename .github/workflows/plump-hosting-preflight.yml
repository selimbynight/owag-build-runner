name: Plump hosting preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NETLIFY_ACCOUNT_ID: 6a5df8dfed90420071d5453d
      NETLIFY_SITE_ID: 175e2662-93d6-4dae-9359-7aac65e079db
      CLOUDFLARE_PROJECT: plumpfluffycubs-fr
    steps:
      - name: Inspect Netlify access and account state
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          request() {
            local label="$1"
            local url="$2"
            local output
            output="$(mktemp)"
            local status
            status="$(curl --silent --show-error \
              --output "$output" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "$url")"
            echo "$label HTTP $status"
            case "$label" in
              user)
                jq '{id,email,full_name}' "$output"
                ;;
              account)
                jq '{id,name,slug,type,capabilities,billing_details}' "$output"
                ;;
              site)
                jq '{id,name,url,ssl_url,admin_url,custom_domain,account_id,state,build_settings}' "$output"
                ;;
              build_status)
                jq '.' "$output"
                ;;
            esac
            rm -f "$output"
          }
          request user https://api.netlify.com/api/v1/user
          request account "https://api.netlify.com/api/v1/accounts/$NETLIFY_ACCOUNT_ID"
          request site "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID"
          request build_status "https://api.netlify.com/api/v1/$NETLIFY_ACCOUNT_ID/builds/status"

      - name: Inspect Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          status="$(curl --silent --show-error \
            --output "$output" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT")"
          echo "pages_project HTTP $status"
          jq '{success,errors,result:{name:.result.name,subdomain:.result.subdomain,domains:.result.domains,production_branch:.result.production_branch,latest_deployment:{id:.result.latest_deployment.id,url:.result.latest_deployment.url,environment:.result.latest_deployment.environment,aliases:.result.latest_deployment.aliases,source:.result.latest_deployment.source}}}' "$output"
