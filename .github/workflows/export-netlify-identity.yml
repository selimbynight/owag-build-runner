name: Export Netlify identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NETLIFY_SITE_ID: 175e2662-93d6-4dae-9359-7aac65e079db
    steps:
      - name: Export the authenticated Netlify identity
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$NETLIFY_AUTH_TOKEN" ]] || {
            echo "::error::NETLIFY_AUTH_TOKEN is missing"
            exit 2
          }

          mkdir -p export
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            https://api.netlify.com/api/v1/user \
            --output /tmp/user.json
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            https://api.netlify.com/api/v1/accounts \
            --output /tmp/accounts.json
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" \
            --output /tmp/site.json

          jq -nS \
            --slurpfile user /tmp/user.json \
            --slurpfile accounts /tmp/accounts.json \
            --slurpfile site /tmp/site.json \
            --arg exported_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '
              ($user[0]) as $u
              | ($accounts[0]) as $a
              | ($site[0]) as $s
              | {
                  exportedAt: $exported_at,
                  authenticatedUser: {
                    id: $u.id,
                    uid: $u.uid,
                    email: $u.email,
                    fullName: $u.full_name
                  },
                  targetSite: {
                    id: $s.id,
                    name: $s.name,
                    url: $s.url,
                    adminUrl: $s.admin_url,
                    customDomain: $s.custom_domain,
                    accountId: $s.account_id,
                    accountSlug: $s.account_slug
                  },
                  associatedAccount: (
                    first(
                      $a[]
                      | select(.id == $s.account_id)
                      | {
                          id: .id,
                          name: .name,
                          slug: .slug,
                          type: .type
                        }
                    )
                  )
                }
            ' > export/netlify-identity.json

          jq -e '
            .authenticatedUser.email
            and .targetSite.id
            and .targetSite.accountId
            and .associatedAccount.id
            and (.targetSite.accountId == .associatedAccount.id)
          ' export/netlify-identity.json >/dev/null
          sha256sum export/netlify-identity.json > export/SHA256SUMS
          chmod 600 export/netlify-identity.json export/SHA256SUMS

          {
            echo "### Netlify identity export"
            echo
            echo "- Authenticated identity and the account owning the fixed target site were matched."
            echo "- No authentication token or unfiltered API response is present in the artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the sanitized identity export
        uses: actions/upload-artifact@v6
        with:
          name: netlify-identity-${{ github.run_id }}
          path: export/
          if-no-files-found: error
          retention-days: 1
